<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join your team</title>
<style>
  :root {
  /* SECUTIX brand toolkit (April 2022): Burgundy #B40050 + Orange #FF5500, Dark Grey for text, hero gradient at 30 deg */
  --burg:#B40050; --burg-dark:#8C0046; --burg-mid:#C8508C; --burg-light:#DC9BBE;
  --orange:#FF5500; --orange-dark:#C82D00; --orange-mid:#FF8255; --orange-light:#FFB491;
  --ink:#3C4B55; --ink-mid:#697378; --paper:#F0F0F0; --ok:#006E5F; --bad:#96231E;
  --grad:linear-gradient(30deg, #B40050 20%, 40%, #FF5500 100%);
  --font:"Proxima Nova", Calibri, "Segoe UI", system-ui, sans-serif;
    --text:var(--ink); --muted:var(--ink-mid); --card:#fff; --accent:var(--burg); --err:var(--bad);
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:#B40050 var(--grad) fixed; color:var(--text); font:16px/1.4 var(--font); }
  main { width:100%; max-width:420px; background:var(--card); padding:28px 22px; border-radius:16px; box-shadow:0 4px 24px #0002; text-align:center; }
  h1 { margin:0 0 6px; font-size:1.5rem; font-weight:700; color:var(--burg); text-transform:uppercase; letter-spacing:.06em; }
  p { color:var(--muted); margin:0 0 20px; }
  input, button { width:100%; font:inherit; padding:14px; border-radius:10px; }
  input { border:1px solid #8886; background:transparent; color:inherit; margin-bottom:12px; }
  button { border:0; background:var(--accent); color:#fff; font-weight:700; cursor:pointer; }
  button:hover { background:var(--burg-dark); }
  button:disabled { opacity:.6; }
  .err { color:var(--err); min-height:1.2em; margin-top:10px; }
  .team { font-size:5rem; font-weight:700; color:var(--accent); line-height:1; margin:8px 0; }
  .tname { font-size:1.6rem; font-weight:700; margin-bottom:12px; color:var(--orange-dark); }
  .avatar { width:170px; height:170px; margin:0 auto 6px; }
  .avatar svg { width:100%; height:100%; }
  body.themed main { background:color-mix(in srgb, var(--card) 82%, transparent); backdrop-filter:blur(3px); position:relative; z-index:1; }
  #bg { position:fixed; inset:-30px; opacity:.28; filter:blur(6px); background-size:120px 120px; z-index:0; transition:opacity .4s; }
  .hidden { display:none; }
</style>
</head>
<body>
<div id="bg" class="hidden"></div>
<main>
  <section id="form">
    <h1>Join your team</h1>
    <p>Enter your visa name to get your team.</p>
    <form id="f">
      <input id="name" placeholder="Visa name" maxlength="60" autocomplete="off" required>
      <button id="btn">Submit</button>
    </form>
    <div class="err" id="err" role="alert"></div>
  </section>
  <section id="result" class="hidden">
    <p id="hello"></p>
    <div class="avatar" id="avatar"></div>
    <div>Your team</div>
    <div class="team" id="team"></div>
    <div class="tname" id="tname"></div>
    <p id="meta"></p>
  </section>
</main>
<script src="/avatars.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  function show(e) {
    $('form').classList.add('hidden');
    $('result').classList.remove('hidden');
    $('hello').textContent = e.name;
    $('team').textContent = e.team === 0 ? 10 : e.team;
    $('tname').textContent = e.teamName || '';
    const art = (window.TEAM_AVATARS || {})[e.team] || '';
    $('avatar').innerHTML = art;
    // Team-themed page: team colour + the team's chibi artwork tiled as the background.
    const m = /r="48" fill="(#[0-9a-fA-F]+)"/.exec(art);
    if (art && m) {
      const bg = $('bg');
      bg.style.backgroundImage = `url("data:image/svg+xml;utf8,${encodeURIComponent(art)}")`;
      bg.classList.remove('hidden');
      document.body.classList.add('themed');
    }
    $('meta').textContent = `You are number ${e.order}` + (e.duplicate ? ' (already registered)' : '');
  }
  // Show a saved result only if the server still has it (an admin Reset invalidates old results).
  (async () => {
    let s = null;
    try { s = JSON.parse(localStorage.getItem('entry') || 'null'); } catch {}
    if (!s) return;
    try {
      const r = await fetch(`/api/check?order=${encodeURIComponent(s.order)}&name=${encodeURIComponent(s.name)}`, { cache: 'no-store' });
      const d = await r.json();
      if (d.valid) { try { localStorage.setItem('entry', JSON.stringify(d.entry)); } catch {} show(d.entry); }
      else { try { localStorage.removeItem('entry'); } catch {} }
    } catch { show(s); } // offline / server asleep: keep showing the saved result
  })();
  $('f').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    $('err').textContent = ''; $('btn').disabled = true;
    try {
      const r = await fetch('/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name: $('name').value }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Something went wrong');
      try { localStorage.setItem('entry', JSON.stringify(d)); } catch {}
      show(d);
    } catch (e) { $('err').textContent = e.message; }
    $('btn').disabled = false;
  });
</script>
</body>
</html>
