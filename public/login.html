<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin login</title>
<style>
  :root { --bg:#f5f6fa; --card:#fff; --text:#1b1f2a; --muted:#667; --accent:#3057e8; --err:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12141a; --card:#1c1f28; --text:#eceef5; --muted:#9aa; --accent:#6f8dff; --err:#ff8a80; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--text); font:16px/1.4 system-ui, sans-serif; }
  main { width:100%; max-width:380px; background:var(--card); padding:28px 22px; border-radius:16px; box-shadow:0 4px 24px #0002; }
  h1 { margin:0 0 16px; font-size:1.4rem; text-align:center; }
  label { display:block; color:var(--muted); font-size:.85rem; margin:0 0 4px; }
  input, button { width:100%; font:inherit; padding:12px; border-radius:10px; }
  input { border:1px solid #8886; background:transparent; color:inherit; margin-bottom:12px; }
  button { border:0; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; }
  .err { color:var(--err); min-height:1.2em; margin-top:10px; text-align:center; }
</style>
</head>
<body>
<main>
  <h1>Admin login</h1>
  <form id="f">
    <label for="user">Username</label>
    <input id="user" value="admin" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required autofocus>
    <button id="btn">Log in</button>
  </form>
  <div class="err" id="err" role="alert"></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  $('f').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    $('err').textContent = ''; $('btn').disabled = true;
    try {
      const r = await fetch('/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ user: $('user').value, password: $('password').value }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Login failed');
      location.reload();
    } catch (e) { $('err').textContent = e.message; $('btn').disabled = false; }
  });
</script>
</body>
</html>
